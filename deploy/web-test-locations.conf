location = /resonantor-canvas {
    return 302 /resonantor-canvas/;
}

location ^~ /resonantor-canvas/api/ {
    rewrite ^/resonantor-canvas(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5113;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

location ^~ /resonantor-canvas/admin {
    rewrite ^/resonantor-canvas(/admin.*)$ $1 break;
    proxy_pass http://127.0.0.1:5113;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location = /resonantor-canvas/healthz {
    proxy_pass http://127.0.0.1:5113/healthz;
    proxy_set_header Host $http_host;
}

location ^~ /resonantor-canvas/ {
    alias /opt/web/resonantor-canvas/current/dist/;
    index index.html;
    autoindex off;
    include /opt/web/resonantor-canvas/current/deploy/web-test-static-security.conf;
    add_header Cache-Control "no-cache";
}
