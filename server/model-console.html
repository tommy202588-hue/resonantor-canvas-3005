<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共智体 · 模型设置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1321;color:#e1ecf4;font:14px system-ui,sans-serif}main{width:min(1050px,calc(100% - 40px));margin:36px auto}header,.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}a{color:#ade8ee;text-decoration:none}h1{font-size:25px}h2{font-size:18px}.panel{background:linear-gradient(125deg,#1c293e,#152338);border:1px solid #36445a;border-radius:22px;padding:24px;margin:18px 0}.muted{color:#a0b2c7;line-height:1.8;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{display:block;color:#c3d4df;font-size:13px}input,select,textarea,button{font:inherit;border-radius:10px;border:1px solid #45576e;padding:10px 12px}input,select,textarea{display:block;width:100%;margin-top:7px;background:#101a2a;color:white}textarea{min-height:120px;resize:vertical;line-height:1.6}button{cursor:pointer;background:#b9edf0;color:#102130}button.secondary{background:transparent;color:#b9d4e0}button.danger{background:transparent;color:#f4bca9}button:disabled{opacity:.45;cursor:wait}.message{white-space:pre-wrap;line-height:1.8;color:#c4eff0}.bar{position:sticky;bottom:12px;padding:16px;background:#172638f5;border:1px solid #45576e;border-radius:16px}.provider{border-top:1px solid #36445a;margin-top:20px;padding-top:20px}.provider h3{font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}input[type=checkbox],input[type=radio]{display:inline;width:auto;margin:0 8px 0 0}[hidden]{display:none!important}@media(max-width:600px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:18px}h1{font-size:21px}}
</style></head><body><main>
<header><div><h1>统一模型设置</h1><p class="muted">RESONANTOR | 共智体 · 仅管理员可修改</p></div><div class="actions"><a href="/admin">账户后台 / 管理员登录</a><a href="/admin/gpu">GPU 服务切换</a><a href="/">返回画布首页</a></div></header>
<p class="muted">所有用户使用这里配置的模型。API 密钥只保存在服务端，保存后不再回显；留空保留原密钥。修改服务地址或类型时请重新输入密钥。局域网 HTTP 未加密，建议在本机或 HTTPS 下配置。</p>
<p id="message" class="message" role="status"></p>
<form id="editor" hidden>
<div class="panel"><div class="row"><label>画布批量并发数<input id="concurrency" type="number" min="1" max="15" value="3" required></label><div class="actions"><button id="import-local" class="secondary" type="button">导入此浏览器旧配置</button><button id="import-file" class="secondary" type="button">导入设置 JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div></div><p id="capacity-info" class="muted"></p><p class="muted">导入仅填入当前表单，检查后点击保存才生效。请导入模型设置文件，不是画布工程；旧配置中的密钥仅在你确认保存时提交。</p></div>
<div id="groups"></div><div class="bar row"><span id="revision" class="muted"></span><div class="actions"><button id="reload" type="button" class="secondary">重新加载</button><button type="submit">保存统一配置</button></div></div>
</form>

</main></body></html>
