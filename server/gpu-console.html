<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共智体 · GPU 服务设置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1321;color:#e1ecf4;font:14px system-ui,sans-serif}main{width:min(1050px,calc(100% - 40px));margin:36px auto}header,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}a{color:#ade8ee;text-decoration:none}h1{font-size:25px}h2{font-size:18px}h3{font-size:15px;margin:0}.panel,.server{background:linear-gradient(125deg,#1c293e,#152338);border:1px solid #36445a;border-radius:22px;padding:24px;margin:18px 0}.server{border-radius:16px;background:#111c2c}.muted{color:#a0b2c7;line-height:1.8;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{display:block;color:#c3d4df;font-size:13px}input,select,button{font:inherit;border-radius:10px;border:1px solid #45576e;padding:10px 12px}input,select{display:block;width:100%;margin-top:7px;background:#101a2a;color:white}button{cursor:pointer;background:#b9edf0;color:#102130}button.secondary{background:transparent;color:#b9d4e0}button.danger{background:transparent;color:#f4bca9}button:disabled{opacity:.45;cursor:wait}.message{white-space:pre-wrap;line-height:1.8;color:#c4eff0;min-height:1.5em}.bar{position:sticky;bottom:12px;padding:16px;background:#172638f5;border:1px solid #45576e;border-radius:16px}.status{padding:10px 12px;border-radius:10px;background:#0d2630;color:#b9edf0;font-size:13px}.server header{margin-bottom:16px}.server[data-kind="remote"] .local-only{display:none}.server[data-kind="local"] .remote-only{display:none}[hidden]{display:none!important}@media(max-width:600px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.panel,.server{padding:18px}h1{font-size:21px}}
</style></head><body><main>
<header><div><h1>GPU 服务切换</h1><p class="muted">RESONANTOR | 共智体 · 仅管理员可修改</p></div><div class="actions"><a href="/admin">账户后台</a><a href="/admin/models">模型设置</a><a href="/">返回画布首页</a></div></header>
<p class="muted">此处只允许登记当前服务器与内网 GPU 主机。切换后新任务会使用新的服务；正在处理的任务将继续绑定原 GPU。远程 GPU 需由该主机自行保持 ComfyUI 运行，不允许从浏览器下发任意系统命令。</p>
<p id="message" class="message" role="status"></p>
<form id="login" class="panel" hidden><h2>管理员登录</h2><p class="muted">请使用管理员用户名和密码。普通用户无法查看或更改 GPU 服务。</p><div class="fields"><label>用户名<input name="username" autocomplete="username" value="admin" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label></div><div class="actions" style="margin-top:18px"><button type="submit">登录后台</button></div></form>
<section id="editor" hidden><section class="panel"><div class="row"><div><h2>当前 GPU 服务</h2><p id="active-hint" class="muted">加载中…</p></div><button id="logout" class="secondary" type="button">退出登录</button></div><div class="fields"><label class="wide">新任务使用<select id="active-server"></select></label></div><div class="actions" style="margin-top:16px"><button id="activate" type="button">立即切换当前 GPU</button><span class="status">正在执行的任务不会被迁移</span></div></section><div id="servers"></div><div class="actions"><button id="add" type="button" class="secondary">添加 GPU 服务</button></div><div class="bar row"><span id="revision" class="muted"></span><div class="actions"><button id="reload" type="button" class="secondary">重新加载</button><button id="save" type="button">保存服务配置</button></div></div></section>
SCRIPT_PLACEHOLDER
</main></body></html>
